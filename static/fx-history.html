<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barakah Tape — historical trades</title>
  <style>
    :root { --bg:#071018; --line:#1c3348; --gold2:#f0d9a0; --mint:#7dcaa8; --text:#e8eef0; --muted:#8aa0b0; --sell:#e07a6a; --buy:#5fd0a0; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
    header, main { max-width:960px; margin:0 auto; padding:16px; }
    .brand { font-size:24px; color:var(--gold2); font-weight:700; }
    nav a { color:var(--mint); margin-right:14px; font-size:13px; }
    .meta { color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:13px; }
    .win { color:var(--buy); } .loss { color:var(--sell); }
    .tot { margin-top:16px; font-size:20px; color:var(--gold2); }
    .openbox { background:#102033; border:1px solid #d4b46a; border-radius:12px; padding:12px; margin:12px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Tape history</div>
    <nav>
      <a href="/fx.html">Metals / FX / Oil</a>
      <a href="/fx-history.html">Historical trades</a>
      <a href="/ideas.html">Stock ideas</a>
    </nav>
    <p class="meta">Paper log: one unit of the top-ranked BUY or SELL at 08:00, 12:00 and 16:00 (+04). Points = % move in the trade direction.</p>
  </header>
  <main>
    <div id="open"></div>
    <div id="log" class="meta">Loading…</div>
    <div class="tot" id="cum"></div>
  </main>
<script>
function n(x,d){ if(x==null||Number.isNaN(Number(x))) return "—"; return Number(x).toFixed(d); }
fetch("/api/fx/paper?_="+Date.now()).then(r=>r.json()).then(p=>{
  const op = p.open;
  if (op) {
    document.getElementById("open").innerHTML = `<div class="openbox">
      <b>Open</b> ${op.side} ${op.name||op.symbol} · slot ${op.slot}:00 +04 ${op.date||""}
      · open ${op.open_price} · last ${op.last} · TP1 ${op.tp1} · SL ${op.stop}
    </div>`;
  }
  const rows = (p.trades||[]).slice().reverse();
  if (!rows.length && !op) {
    document.getElementById("log").textContent = "No slot trades yet. Open /fx.html during 08–20 +04.";
    document.getElementById("cum").textContent = "Cumulative points 0%";
    return;
  }
  document.getElementById("log").innerHTML = `<table>
    <thead><tr>
      <th>Date</th><th>Slot</th><th>Market</th><th>Side</th>
      <th>Open</th><th>Close</th><th>Exit</th><th>Points %</th>
    </tr></thead>
    <tbody>${rows.map(t=>{
      const cls = (t.pct||0)>=0?"win":"loss";
      return `<tr>
        <td>${t.date||""}</td>
        <td>${t.slot!=null?(t.slot+":00"):""}</td>
        <td><b>${t.name||t.symbol}</b> <span class="meta">${t.group||""}</span></td>
        <td class="${t.side}">${t.side||""}</td>
        <td>${t.open_price??""}</td>
        <td>${t.close_price??""}</td>
        <td>${t.exit||""}</td>
        <td class="${cls}">${(t.pct>=0?"+":"")+n(t.pct,3)}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
  const cum = p.cumulative != null ? p.cumulative : rows.reduce((a,t)=>a+(t.pct||0),0);
  document.getElementById("cum").innerHTML = `Cumulative points <b>${cum>=0?"+":""}${n(cum,3)}%</b>
    <div class="meta">${p.server_local||""}</div>`;
}).catch(e=>{ document.getElementById("log").textContent = String(e); });
</script>
</body>
</html>
