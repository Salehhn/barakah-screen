<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barakah Tape — historical trades</title>
  <style>
    :root { --bg:#071018; --line:#1c3348; --gold2:#f0d9a0; --mint:#7dcaa8; --text:#e8eef0; --muted:#8aa0b0; --sell:#e07a6a; --buy:#5fd0a0; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
    header, main { max-width:960px; margin:0 auto; padding:16px; }
    .brand { font-size:24px; color:var(--gold2); font-weight:700; }
    nav a { color:var(--mint); margin-right:14px; font-size:13px; }
    .meta { color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:13px; }
    .win { color:var(--buy); } .loss { color:var(--sell); }
    .tot { margin-top:16px; font-size:22px; color:var(--gold2); }
    .openbox { background:#102033; border:1px solid #d4b46a; border-radius:12px; padding:12px; margin:12px 0; }
    .stat { font-size:16px; color:var(--gold2); margin:8px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Tape history</div>
    <nav>
      <a href="/">Halal screen</a>
      <a href="/ideas.html">Stock ideas</a>
      <a href="/history.html">Stock history</a>
      <a href="/fx.html">FX / metals</a>
      <a href="/fx-history.html">FX history</a>
    </nav>
    <p class="meta">Paper 05:00–15:00 Muscat. Today resets at midnight. Total is kept in this browser if Render restarts.</p>
  </header>
  <main>
    <div class="stat" id="count">Trades: 0</div>
    <div id="open"></div>
    <div id="log" class="meta">Loading…</div>
    <div class="tot" id="cum"></div>
  </main>
<script>
function n(x,d){ if(x==null||Number.isNaN(Number(x))) return "—"; return Number(x).toFixed(d); }
function keyOf(t){ return [t.date, t.slot, t.symbol, t.side, t.open_price].join("|"); }
function loadLocal(){ try { return JSON.parse(localStorage.getItem("fxPaperTrades")||"[]"); } catch(e){ return []; } }
function saveLocal(rows){ localStorage.setItem("fxPaperTrades", JSON.stringify(rows.slice(-400))); }
function merge(serverRows){
  const map = {};
  loadLocal().forEach(t => { if(t&&t.symbol) map[keyOf(t)] = t; });
  (serverRows||[]).forEach(t => { if(t&&t.symbol) map[keyOf(t)] = t; });
  const all = Object.values(map).sort((a,b)=> String(a.date||"").localeCompare(String(b.date||"")) || String(a.slot||"").localeCompare(String(b.slot||"")));
  saveLocal(all);
  return all;
}
function paint(p){
  const op = p.open;
  const rows = merge(p.trades||[]).slice().reverse();
  const today = p.today || (p.server_local||"").slice(0,10);
  const closedPips = rows.reduce((a,t)=> a + (t.pips!=null?Number(t.pips):0), 0);
  const dayClosed = rows.filter(t=>t.date===today).reduce((a,t)=> a + (t.pips!=null?Number(t.pips):0), 0);
  const live = op && op.live_pips != null ? Number(op.live_pips) : 0;
  const day = dayClosed + (op && op.date===today ? live : 0);
  const cum = closedPips + (op ? live : 0);
  document.getElementById("count").textContent = "Trades listed: " + (rows.length + (op?1:0)) + " · kept in this browser";
  if (op) {
    const cls = live>=0?"win":"loss";
    document.getElementById("open").innerHTML = `<div class="openbox">
      <b>Open now</b> ${op.side} ${op.name||op.symbol} · slot ${op.slot||""} ${op.date||""}<br>
      open ${op.open_price} · last ${op.last} · TP1 ${op.tp1} · SL ${op.stop}<br>
      Live <span class="${cls}">${live>=0?"+":""}${n(live,1)} pips</span>
    </div>`;
  } else document.getElementById("open").innerHTML = "";
  if (!rows.length && !op) {
    document.getElementById("log").textContent = "No trades yet. Keep /fx.html open 05:00–15:00 Muscat.";
    document.getElementById("cum").textContent = "Today 0 pips · Total 0 pips";
    return;
  }
  document.getElementById("log").innerHTML = `<table>
    <thead><tr><th>#</th><th>Date</th><th>Slot</th><th>Market</th><th>Side</th><th>Open</th><th>Close</th><th>Exit</th><th>Pips</th></tr></thead>
    <tbody>${rows.map((t,i)=>{
      const pts = t.pips != null ? Number(t.pips) : 0;
      const cls = pts>=0?"win":"loss";
      return `<tr><td>${rows.length-i}</td><td>${t.date||""}</td><td>${t.slot!=null?t.slot:""}</td>
        <td><b>${t.name||t.symbol}</b></td><td class="${t.side}">${t.side||""}</td>
        <td>${t.open_price??""}</td><td>${t.close_price??""}</td><td>${t.exit||""}</td>
        <td class="${cls}">${pts>=0?"+":""}${n(pts,1)} pips</td></tr>`;
    }).join("")}</tbody></table>`;
  document.getElementById("cum").innerHTML = `Today <span class="${day>=0?"win":"loss"}"><b>${day>=0?"+":""}${n(day,1)} pips</b></span>
    &nbsp;·&nbsp; Total <span class="${cum>=0?"win":"loss"}"><b>${cum>=0?"+":""}${n(cum,1)} pips</b></span>
    <div class="meta">${p.server_local||""} · host restart will not zero this browser</div>`;
}
async function tick(){
  try { paint(await fetch("/api/fx/paper?v=pips&_="+Date.now()).then(r=>r.json())); }
  catch(e){ document.getElementById("log").textContent = String(e); }
}
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
