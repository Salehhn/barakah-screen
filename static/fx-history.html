<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barakah Tape — historical trades</title>
  <style>
    :root { --bg:#071018; --line:#1c3348; --gold2:#f0d9a0; --mint:#7dcaa8; --text:#e8eef0; --muted:#8aa0b0; --sell:#e07a6a; --buy:#5fd0a0; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
    header, main { max-width:960px; margin:0 auto; padding:16px; }
    .brand { font-size:24px; color:var(--gold2); font-weight:700; }
    nav a { color:var(--mint); margin-right:14px; font-size:13px; }
    .meta { color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:13px; }
    .win { color:var(--buy); } .loss { color:var(--sell); }
    .tot { margin-top:16px; font-size:22px; color:var(--gold2); }
    .openbox { background:#102033; border:1px solid #d4b46a; border-radius:12px; padding:12px; margin:12px 0; }
    .stat { font-size:16px; color:var(--gold2); margin:8px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Tape history</div>
    <nav>
      <a href="/fx.html">Metals / FX / Oil</a>
      <a href="/fx-history.html">Historical trades</a>
      <a href="/ideas.html">Stock ideas</a>
    </nav>
    <p class="meta">Paper log while /fx.html is open (08:00–20:00 +04). Points are <b>pips</b> (gold 0.01 = 1 pip, EURUSD 0.0001 = 1 pip, JPY 0.01 = 1 pip, BTC $1 = 1 pip). Live refresh.</p>
  </header>
  <main>
    <div class="stat" id="count">Trades: 0</div>
    <div id="open"></div>
    <div id="log" class="meta">Loading…</div>
    <div class="tot" id="cum"></div>
  </main>
<script>
function n(x,d){ if(x==null||Number.isNaN(Number(x))) return "—"; return Number(x).toFixed(d); }
function paint(p){
  const op = p.open;
  const rows = (p.trades||[]).slice().reverse();
  const nClosed = p.closed_count != null ? p.closed_count : rows.length;
  const nOpen = op ? 1 : 0;
  document.getElementById("count").textContent = "Trades listed: " + (nClosed + nOpen) + "  (closed " + nClosed + (nOpen?" + 1 open":"") + ")";
  if (op) {
    const live = op.live_pips != null ? op.live_pips : (op.live_pct != null ? op.live_pct : 0);
    const cls = live>=0?"win":"loss";
    document.getElementById("open").innerHTML = `<div class="openbox">
      <b>Open now</b> ${op.side} ${op.name||op.symbol} · slot ${op.slot||""} ${op.date||""}<br>
      open ${op.open_price} · last ${op.last} · TP1 ${op.tp1} · SL ${op.stop}<br>
      Live <span class="${cls}">${live>=0?"+":""}${n(live,1)} pips</span>
    </div>`;
  } else {
    document.getElementById("open").innerHTML = "";
  }
  if (!rows.length && !op) {
    document.getElementById("log").textContent = "No trades yet. Keep /fx.html open 08–20 +04.";
    document.getElementById("cum").textContent = "Cumulative 0 pips";
    return;
  }
  document.getElementById("log").innerHTML = `<table>
    <thead><tr>
      <th>#</th><th>Date</th><th>Slot</th><th>Market</th><th>Side</th>
      <th>Open</th><th>Close</th><th>Exit</th><th>Pips</th>
    </tr></thead>
    <tbody>${rows.map((t,i)=>{
      const pts = t.pips != null ? t.pips : t.pct;
      const cls = (pts||0)>=0?"win":"loss";
      return `<tr>
        <td>${rows.length-i}</td>
        <td>${t.date||""}</td>
        <td>${t.slot!=null?t.slot:""}</td>
        <td><b>${t.name||t.symbol}</b> <span class="meta">${t.group||""}</span></td>
        <td class="${t.side}">${t.side||""}</td>
        <td>${t.open_price??""}</td>
        <td>${t.close_price??""}</td>
        <td>${t.exit||""}</td>
        <td class="${cls}">${(pts>=0?"+":"")+n(pts,1)}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
  const cum = p.cumulative != null ? p.cumulative : rows.reduce((a,t)=>a+(t.pips!=null?t.pips:0),0);
  const ccls = cum>=0?"win":"loss";
  document.getElementById("cum").innerHTML = `Cumulative <span class="${ccls}"><b>${cum>=0?"+":""}${n(cum,1)} pips</b></span>
    <div class="meta">${p.server_local||""} · includes open trade if any</div>`;
}
async function tick(){
  try { paint(await fetch("/api/fx/paper?_="+Date.now()).then(r=>r.json())); }
  catch(e){ document.getElementById("log").textContent = String(e); }
}
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
